# =====================================================================================
#  HeatRoute — сервис моделирования трасс подключения к тепловым сетям (ЛЦТ 2026)
#
#  Требование ТЗ, раздел 3.2: проект собирается и разворачивается через
#  docker-compose 1.29.2 на Ubuntu Server 22, все сервисы поднимаются отсюда.
#  Формат файла — 3.8: он одинаково читается и docker-compose 1.29.2, и compose v2,
#  поэтому демонстрация на машине жюри не зависит от версии инструмента.
#
#  Запуск:   docker-compose up -d --build
#  Проверка: http://localhost:8080/swagger-ui.html   — API
#            http://localhost:3000                   — интерфейс с картой
# =====================================================================================
version: "3.8"

services:

  db:
    image: postgis/postgis:16-3.4
    container_name: heatroute-db
    environment:
      POSTGRES_DB: heatroute
      POSTGRES_USER: heatroute
      POSTGRES_PASSWORD: ${DB_PASSWORD:-heatroute}
      # Расчёт пишет результат пачками, поэтому WAL держим просторнее значений по умолчанию.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatroute -d heatroute"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ../ops/Dockerfile.backend
    container_name: heatroute-backend
    depends_on:
      - db
    environment:
      HEATROUTE_DB_URL: jdbc:postgresql://db:5432/heatroute
      HEATROUTE_DB_USER: heatroute
      HEATROUTE_DB_PASSWORD: ${DB_PASSWORD:-heatroute}
      HEATROUTE_STORAGE_DIR: /var/lib/heatroute/storage
      HEATROUTE_TMP_DIR: /var/lib/heatroute/tmp
      # ТЗ даёт 16 ГБ ОЗУ. Куча ограничена явно: потоковая обработка входного файла
      # рассчитана на то, что геометрия живёт в куче, а сам файл — на диске.
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=70
        -XX:+UseG1GC
        -Djava.awt.headless=true
        -Dfile.encoding=UTF-8
        -Duser.timezone=Europe/Moscow
    volumes:
      # Временное дисковое хранилище: входные файлы до 3 ГБ и выгрузки до 500 МБ
      # не должны попадать в слой контейнера.
      - app-storage:/var/lib/heatroute
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../ops/Dockerfile.frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    container_name: heatroute-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  db-data:
  app-storage:
